services:
  postgres:
    image: postgres:17-alpine
    container_name: excel-postgres
    restart: unless-stopped
    env_file:
      - ./config.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks: # 🔗 Agregar esta sección para conectar a la red
      - ExcelDB-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d excelDB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: excelDB-backend
    restart: unless-stopped
    env_file:
      - ./config.env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - ExcelDB-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >
      sh -c "pip install -r requirements.txt &&
            pip install -r requirements-dev.txt &&
            uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: exceldb-migrate
    env_file:
      - ./config.env
    networks:
      - ExcelDB-network
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: excelpython-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_API_PROXY_TARGET=http://backend:8000
    networks:
      - ExcelDB-network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  ExcelDB-network:
    driver: bridge
